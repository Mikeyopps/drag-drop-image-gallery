
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery-container">
        <h1>Drag & Drop Image Gallery</h1>
        <p>Drag any thumbnail into the large display box.</p>

        <div class="gallery">
            <div class="thumbnails">
                <img src="images/image1.jpg" alt="Image 1" draggable="true" class="thumbnail">
                <img src="images/image2.jpg" alt="Image 2" draggable="true" class="thumbnail">
                <img src="images/image3.jpg" alt="Image 3" draggable="true" class="thumbnail">
                <img src="images/image4.jpg" alt="Image 4" draggable="true" class="thumbnail">
                <img src="images/image5.jpg" alt="Image 5" draggable="true" class="thumbnail">
            </div>

            <div class="display-box" id="displayBox">
                <p id="placeholder">Drop an image here</p>
                <img id="mainImage" src="" alt="Selected image">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
